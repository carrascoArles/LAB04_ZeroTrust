name: CI

on:
  pull_request:
  push:
    branches: [main, "0*-*"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Pruebas con el motor en memoria
        run: npm test
      - name: Pruebas con DynamoDB Local
        run: npm test
        env:
          DYNAMODB_ENDPOINT: http://localhost:8000
      - run: npm run build
      - name: Dependencias de producción
        run: npm audit --omit=dev --audit-level=high

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install cfn-lint
      - run: cfn-lint infra/template.yaml
